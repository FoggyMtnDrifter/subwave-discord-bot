name: Build and publish Docker image

# Builds a multi-arch (amd64 + arm64) image and pushes it to the GitHub
# Container Registry (GHCR) at ghcr.io/<owner>/<repo>.
#
# No secrets to configure: the built-in GITHUB_TOKEN authenticates to GHCR.
#
# First-publish note: a brand-new GHCR package can only be *created* by a run on
# the default branch (a tag ref cannot create it — see actions/runner#1039). So
# the very first successful run must come from a push to `main`; that seeds and
# auto-links the package, after which tag runs (and everything else) publish on
# their own. The concurrency guard below keeps a near-simultaneous branch+tag
# push from racing to create the package.
#
# After the first successful run, make the package public in the repo's Packages
# settings so users can `docker pull` it without logging in.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Serialize runs so a branch push and a tag push can't both try to create the
# package at once; queue instead of cancel so no publish is dropped.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Fixed image name (independent of the repo name) so it always matches the
  # ref in docker-compose.discord.yml. Owner is lowercased by metadata-action.
  IMAGE_NAME: ${{ github.repository_owner }}/subwave-discord-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
